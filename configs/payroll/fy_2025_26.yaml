# Payroll rules for Financial Year 2025-26 (India)
#
# ⚠️  VERIFY EVERY NUMBER BELOW against https://incometax.gov.in before relying
#     on it for a real decision. Tax rules change in the Union Budget each year,
#     and no config file should be trusted just because it looks official.
#
# WHY ONE FILE PER FINANCIAL YEAR, NEVER EDITED:
#   Next year you add fy_2026_27.yaml. You do NOT edit this one.
#   That way you can always recompute what someone's take-home *was* in
#   2025-26 — which matters when HR asks "why did his in-hand change?"
#   Editing history destroys your ability to answer that.

financial_year: "2025-26"
regime: new
source: "https://incometax.gov.in — verify before use"

# VERIFIED 2026-08-08 against an actual payslip PDF (year 1, pre-increment):
#   BASIC 26,000 + HRA 13,000 + SPECIAL 11,000 = gross 50,000
#   − PF 1,800 − Medical 300 = net 47,900   ✓ matches the payslip to the rupee
#   CTC 51,800 = gross 50,000 + employer PF 1,800
#   Annual projection 6,00,000 → taxable 5,25,000 ✓ matches the payslip's own
#   TDS block, which independently validates the standard-deduction logic.
#   Professional tax line is blank → stays disabled below.
#
# This SUPERSEDES a 2026-08-07 entry based on verbally reported figures, which
# had the basic fraction (33% vs 52%), the ceiling (off vs on) and the insurance
# premium (200 vs 300) all wrong. Numbers read off a document beat numbers
# recalled from one.
#
# Income tax slabs: STILL UNVERIFIED. These are FY 2025-26 figures and we are now
#   in FY 2026-27. They happen not to affect the payslip above (the 87A rebate
#   zeroes the tax either way), so the match does NOT validate them.
#   Check incometax.gov.in and create fy_2026_27.yaml — do not edit this file.
verified_on: "2026-08-08"
verified_against: "payslip PDF, year 1: gross 50,000 = 26,000 basic + 13,000 HRA + 11,000 special; PF 1,800; medical 300; net 47,900; CTC 51,800"

# ── Provident Fund ──────────────────────────────────────────────────
# The employee's own contribution — this is what gets deducted from pay.
# The employer contributes the same again, but that is the employer's
# cost, not a deduction, so it never appears in take-home.
provident_fund:
  employee_rate: 0.12

  # MEASURED FROM AN ACTUAL PAYSLIP (Jul 2025), not inferred:
  #   BASIC ₹26,000 + HRA ₹13,000 + SPECIAL ₹11,000 = gross ₹50,000
  #   → basic is 52% of gross.
  #
  # An earlier version of this file said 33.33%, reverse-engineered from a
  # verbally reported "PF is ₹3,600" before any payslip existed. That inference
  # was wrong in both of its inputs — see the ceiling note below.
  basic_as_fraction_of_gross: 0.52

  # THE CEILING QUESTION — now settled by the payslip.
  #   Statutory minimum requires PF only on the first ₹15,000/month of basic.
  #   Some companies are more generous and apply it to full basic.
  #
  #   Payslip: PF deduction ₹1,800. And 12% × ₹15,000 = ₹1,800 exactly, while
  #   12% of the actual basic (₹26,000) would be ₹3,120. So the company DOES
  #   apply the statutory ceiling.
  #
  #   This reverses the earlier setting, which had been deduced from a reported
  #   ₹3,600 that almost certainly was employee ₹1,800 + employer ₹1,800 read
  #   together off a payslip that lists them on separate lines.
  apply_statutory_ceiling: true
  statutory_ceiling_monthly: 15000

  # The employer contributes the same 12% again (payslip line "PFEmpr" ₹1,800).
  # It is NOT deducted from the employee, so it never touches take-home — but it
  # IS part of CTC, which is why CTC (₹51,800) exceeds gross (₹50,000) by
  # exactly ₹1,800.
  employer_matches: true

# ── Insurance / Medical ─────────────────────────────────────────────
# Payslip line is "Medical", ₹300/month (the YTD line over four months confirms it).
# An earlier version said ₹200, from a verbal estimate. The document settled it.
insurance:
  monthly_premium: 300

# ── Professional tax ────────────────────────────────────────────────
# State-level tax. Karnataka, Maharashtra, West Bengal and others levy it;
# several states do not. Vishal did not mention it, so it is off by default.
# Turn it on and set the amount if payroll actually deducts it.
professional_tax:
  enabled: false
  monthly_amount: 200

# ── Income tax (new regime) ─────────────────────────────────────────
income_tax:
  # Flat deduction available to salaried employees before tax is computed.
  standard_deduction: 75000

  # Slabs are MARGINAL: you pay each rate only on the income falling inside
  # that band, not on your whole salary. A very common misunderstanding —
  # crossing into the 30% bracket does not tax everything at 30%.
  slabs:
    - { upto: 400000, rate: 0.00 }
    - { upto: 800000, rate: 0.05 }
    - { upto: 1200000, rate: 0.10 }
    - { upto: 1600000, rate: 0.15 }
    - { upto: 2000000, rate: 0.20 }
    - { upto: 2400000, rate: 0.25 }
    - { upto: null, rate: 0.30 } # null = no upper limit

  # Section 87A rebate: if taxable income is at or below the threshold,
  # the tax is wiped out (up to the cap). This is why someone earning
  # ₹6L pays no income tax at all.
  rebate_87a:
    taxable_income_threshold: 1200000
    max_rebate: 60000

  # ── Surcharge ──────────────────────────────────────────────────
  # An extra percentage charged ON THE TAX (not on income) once total income
  # crosses ₹50 lakh. New-regime rates, AY 2026-27. Note the top two bands are
  # both 25% — the new regime caps surcharge at 25% where the old regime goes
  # to 37%.
  #
  # `above` is the threshold the band starts at, which is also the figure
  # marginal relief is computed against.
  surcharge:
    - { above: 5000000, rate: 0.10 } # ₹50L – ₹1Cr
    - { above: 10000000, rate: 0.15 } # ₹1Cr – ₹2Cr
    - { above: 20000000, rate: 0.25 } # ₹2Cr – ₹5Cr
    - { above: 50000000, rate: 0.25 } # above ₹5Cr

  # MARGINAL RELIEF. Surcharge is a cliff: at ₹50,00,001 of taxable income a 10%
  # surcharge suddenly applies to the WHOLE tax bill, so earning ₹1 more could
  # cost you over a lakh. The law prevents that: tax + surcharge may not exceed
  # the tax at the threshold plus the income above the threshold.
  #
  # Without this the calculator would overstate tax for anyone just over a
  # boundary — and "just over" is exactly where people negotiating salaries sit.
  marginal_relief: true

  # Health & Education cess, charged on tax PLUS surcharge (not on income).
  cess_rate: 0.04
